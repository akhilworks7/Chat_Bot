[theme]
base = "dark"
primaryColor = "#6366f1"
backgroundColor = "#0b0f19"
secondaryBackgroundColor = "#0f172a"
textColor = "#f8fafc"
font = "sans serif"

[server]
fileWatcherType = "none"
headless = true
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 200

[browser]
gatherUsageStats = false
